<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | CMS Chem admin</title><meta name="robots" content="noindex">
  <link rel="stylesheet" href="/static/css/admin.css?v=1">
</head>
<body>
<div class="login">
  <form class="panel" method="post" action="/admin/login">
    <img src="/static/img/logo.png" alt="" width="56" style="margin-bottom:8px">
    <h1 style="margin-bottom:16px">Log in to the admin</h1>
    {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="u">Username</label><input id="u" name="username" type="text" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Log in</button>
    <p class="muted" style="margin-top:16px"><a href="/">Back to the website</a></p>
  </form>
</div>
</body>
</html>
