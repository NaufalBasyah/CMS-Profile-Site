{% extends "admin/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="top"><h1>Change password</h1></div>
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
<form class="panel" method="post" action="/admin/account">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="c">Current password</label><input id="c" name="current" type="password" autocomplete="current-password" required></div>
  <div class="field"><label for="n">New password</label><input id="n" name="new" type="password" autocomplete="new-password" required><div class="help">At least 10 characters.</div></div>
  <div class="field"><label for="r">Repeat new password</label><input id="r" name="confirm" type="password" autocomplete="new-password" required></div>
  <button class="btn" type="submit">Change password</button>
</form>
{% endblock %}
