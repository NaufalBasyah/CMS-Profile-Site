# Render Blueprint: one Node web service. The database is Supabase (Postgres).
# In Render: New > Blueprint > pick this repo. Render reads this file and asks
# for the values marked sync: false.
services:
  - type: web
    name: cms-profile-site
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # Supabase connection string (Connect > Session pooler or Direct)
      - key: DB_SCHEMA
        value: cms_next   # a fresh schema; see README before pointing this at the old "cms" schema
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # first admin password, used only when the schema has no users yet
      - key: SITE_URL
        sync: false   # e.g. https://cms-profile-site.onrender.com (used for sitemap and social previews)
